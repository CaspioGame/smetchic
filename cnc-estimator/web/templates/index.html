{{define "index.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CNC Estimator</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f3f5f8; }
    body { margin: 0; }
    main { max-width: 760px; margin: 8vh auto; padding: 0 24px; }
    .card { padding: 36px; border: 1px solid #e0e5ec; border-radius: 14px; background: #fff; box-shadow: 0 12px 32px #1720330b; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: #5c6678; line-height: 1.6; }
    label { display: block; margin: 28px 0 10px; font-weight: 650; }
    input[type=file] { display: block; width: 100%; padding: 12px; border: 1px solid #cbd3df; border-radius: 8px; box-sizing: border-box; }
    button, .button { display: inline-block; margin-top: 20px; padding: 12px 20px; border: 0; border-radius: 8px; background: #2457d6; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:hover, .button:hover { background: #1948bd; }
    .notice { margin-top: 24px; padding: 14px 16px; border-radius: 8px; background: #fff5e8; color: #8a4c00; }
    .muted { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>CNC Estimator</h1>
      <p>Предварительный расчёт обработки детали по тестовому файлу <code>.part</code>.</p>
      <p class="muted">Результаты демонстрационные и не являются точным CAM-расчётом или коммерческим предложением.</p>
      {{if .Error}}<div class="notice" role="alert"><strong>Ошибка расчёта</strong><br>{{.Error}}</div>{{end}}
      <form method="POST" action="/" enctype="multipart/form-data">
        <label for="part_file">Файл детали (.part)</label>
        <input id="part_file" type="file" name="part_file" accept=".part" required>
        <button type="submit">Рассчитать</button>
      </form>
    </section>
  </main>
</body>
</html>
{{end}}
